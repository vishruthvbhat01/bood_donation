<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BloodLink – Donation Management System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Sidebar Nav -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <span class="logo-icon">🩸</span>
      <span class="logo-text">BloodLink</span>
    </div>
    <nav class="nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <span class="nav-icon">⊞</span> Dashboard
      </a>
      <a href="#" class="nav-item" data-page="donors">
        <span class="nav-icon">♥</span> Donors
      </a>
      <a href="#" class="nav-item" data-page="register">
        <span class="nav-icon">+</span> Register Donor
      </a>
      <a href="#" class="nav-item" data-page="requests">
        <span class="nav-icon">⚡</span> Blood Requests
      </a>
      <a href="#" class="nav-item" data-page="new-request">
        <span class="nav-icon">✚</span> New Request
      </a>
      <a href="#" class="nav-item" data-page="stock">
        <span class="nav-icon">◉</span> Blood Stock
      </a>
      <a href="#" class="nav-item" data-page="search">
        <span class="nav-icon">⌕</span> Search Donors
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-badge">Admin Panel</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="topbar-right">
        <span class="status-dot"></span>
        <span class="status-text">System Active</span>
      </div>
    </header>

    <div class="content" id="content">
      <!-- Pages injected here by JS -->
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
